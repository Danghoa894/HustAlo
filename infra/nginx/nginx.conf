# infra/nginx/nginx.conf — nginx biên production (development_guide.md §9.1, §9.3; kiến trúc §9.6).
# Chứng chỉ Let's Encrypt lấy với `--cert-name hustalo` nên đường dẫn cố định, không phụ thuộc tên miền:
#   certbot certonly --webroot -w /var/www/certbot --cert-name hustalo -d "$DOMAIN"
#   → /etc/letsencrypt/live/hustalo/{fullchain,privkey}.pem
# Lần đầu (chưa có chứng chỉ): tạm comment block 443, `up`, chạy certbot, bỏ comment, `nginx -s reload` (§9.6).
# `http2 on;` cần nginx ≥ 1.25.1 (image nginx:alpine hiện hành).
# File tĩnh SPA do container client phục vụ (client/nginx.conf: try_files → /index.html, cache /assets immutable,
# index.html no-cache); ở đây chỉ TLS, header bảo mật và proxy. add_header chỉ đặt ở cấp server (không location nào
# có add_header riêng) để mọi response đều thừa hưởng.
worker_processes auto;
events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;
  # ≥ giới hạn body REST của server.
  client_max_body_size 1m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream hustalo_server {
    server server:4000;
  }
  upstream hustalo_client {
    server client:8080;
  }

  # ---- 80: ACME HTTP-01, mọi đường dẫn khác redirect sang HTTPS ----
  server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }
    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ---- 443 ----
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/hustalo/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hustalo/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # Kiến trúc §9.6 — cùng chính sách với helmet của server.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' wss://$host https://$host; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;

    location /api/ {
      proxy_pass http://hustalo_server;
    }

    location /socket.io/ {
      proxy_pass http://hustalo_server;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # > SOCKET_PING_INTERVAL (25 s) + SOCKET_PING_TIMEOUT (20 s) — kiến trúc §6.4, T-07/T-26.
      proxy_read_timeout 75s;
    }

    location / {
      proxy_pass http://hustalo_client;
    }
  }
}

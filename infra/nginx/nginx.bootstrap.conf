# infra/nginx/nginx.bootstrap.conf — nginx biên khi CHƯA có chứng chỉ Let's Encrypt (development_guide.md §9.6).
# infra/deploy-prod.sh tự chọn file này nếu thiếu /etc/letsencrypt/live/hustalo/{fullchain,privkey}.pem, vì
# nginx.conf (có block 443) không khởi động được khi thiếu chứng chỉ. Chỉ cổng 80: phục vụ ACME HTTP-01 cho
# `certbot certonly --webroot -w /var/www/certbot --cert-name hustalo -d <domain>`; mọi đường dẫn khác trả 503
# (không phục vụ app qua HTTP — thiếu HTTPS thì cookie Secure và camera/micro không hoạt động, §9.1).
worker_processes 1;
events {
  worker_connections 256;
}

http {
  server_tokens off;
  charset utf-8;

  server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }
    location / {
      default_type text/plain;
      return 503 "HUSTALO: chưa có chứng chỉ TLS — lấy chứng chỉ theo development_guide.md §9.6 rồi deploy lại.\n";
    }
  }
}

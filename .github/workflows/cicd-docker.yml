# .github/workflows/cicd-docker.yml — build/push image Docker Hub rồi deploy lên VM (development_guide.md §9.5–§9.7).
# Trigger: workflow `ci` kết thúc success trên main, hoặc chạy tay. Secret chỉ đọc từ GitHub Secrets, không echo,
# không bật `set -x` trong bước có secret.
# Xác minh với tài liệu chính thức của GitHub Actions và docker/*-action: major hiện hành (setup-buildx-action@v3,
# login-action@v3, build-push-action@v6) và cú pháp workflow_run.
name: cicd-docker

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  # SHA của lần chạy ci (workflow_run) hoặc commit hiện tại (workflow_dispatch)
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build-push:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build + push server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hustalo-server:${{ env.SHA }}
            ${{ secrets.DOCKERHUB_USERNAME }}/hustalo-server:latest
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
      - name: Build + push client
        uses: docker/build-push-action@v6
        with:
          context: .
          file: client/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hustalo-client:${{ env.SHA }}
            ${{ secrets.DOCKERHUB_USERNAME }}/hustalo-client:latest
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - name: Cấu hình SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Đồng bộ file hạ tầng
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH/infra/nginx' '$DEPLOY_PATH/infra/mongo' '$DEPLOY_PATH/server'"
          scp -i ~/.ssh/deploy_key infra/docker-compose.prod.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/infra/"
          scp -i ~/.ssh/deploy_key infra/nginx/nginx.conf "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/infra/nginx/"
          scp -i ~/.ssh/deploy_key infra/mongo/init-prod.js "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/infra/mongo/"
      - name: Ghi env production (umask 077) và deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          PROD_INFRA_ENV: ${{ secrets.PROD_INFRA_ENV }}
          PROD_SERVER_ENV: ${{ secrets.PROD_SERVER_ENV }}
        run: |
          # Nội dung env đi qua stdin của ssh, không nằm trên dòng lệnh / log.
          { printf '%s\n' "$PROD_INFRA_ENV"; printf 'IMAGE_TAG=%s\n' "$SHA"; } |
            ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "umask 077 && cat > '$DEPLOY_PATH/infra/.env.prod'"
          printf '%s\n' "$PROD_SERVER_ENV" |
            ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "umask 077 && cat > '$DEPLOY_PATH/server/.env.prod'"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && \
            docker compose --env-file infra/.env.prod -f infra/docker-compose.prod.yml pull && \
            docker compose --env-file infra/.env.prod -f infra/docker-compose.prod.yml up -d --wait && \
            docker compose --env-file infra/.env.prod -f infra/docker-compose.prod.yml exec -T server node dist/infra/db/indexes.js"

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      E2E_BASE_URL: https://${{ secrets.PROD_DOMAIN }}
      # 2 tài khoản smoke tạo một lần bằng POST /auth/register (§9.6); mật khẩu chỉ nằm trong GitHub Secrets.
      SMOKE_A_EMAIL: ${{ secrets.SMOKE_A_EMAIL }}
      SMOKE_A_PASSWORD: ${{ secrets.SMOKE_A_PASSWORD }}
      SMOKE_A_USERNAME: ${{ secrets.SMOKE_A_USERNAME }}
      SMOKE_A_DISPLAYNAME: ${{ secrets.SMOKE_A_DISPLAYNAME }}
      SMOKE_B_EMAIL: ${{ secrets.SMOKE_B_EMAIL }}
      SMOKE_B_PASSWORD: ${{ secrets.SMOKE_B_PASSWORD }}
      SMOKE_B_USERNAME: ${{ secrets.SMOKE_B_USERNAME }}
      SMOKE_B_DISPLAYNAME: ${{ secrets.SMOKE_B_DISPLAYNAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # TC-ARCH-016: health qua nginx, redirect 80 → 443, HSTS, SPA fallback (bảng §9.7)
      - run: npx vitest run src/__tests__/deploy.test.ts
        working-directory: server
      # TC-ARCH-017: smoke @smoke trên môi trường đã deploy
      - run: npx playwright install --with-deps chromium
        working-directory: client
      - run: npm run test:e2e -- --project=chromium --grep @smoke
      - name: Ghi SHA để rollback khi verify fail
        if: failure()
        run: |
          echo "::error::verify fail cho ${SHA} — rollback = đặt IMAGE_TAG về SHA trước đó trong infra/.env.prod rồi pull + up -d --wait (§9.6)"

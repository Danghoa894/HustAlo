# HUSTALO — API Specification (OpenAPI 3.0.3)
# Version: 1.0.0 | Status: Draft — chờ review (file 5/6) | Ngày: 2026-10-27
# File liên quan:
#   - system_architecture.md §4.4 (enum, hằng số, mã lỗi), §4.5 (socket event), §4.6 (danh mục endpoint), §6.3 (cookie, CSRF)
#   - product_requirements.md (FR/AC/EC — tham chiếu qua x-requirements ở từng operation)
#   - database_schema.md (nguồn dữ liệu DTO)
#   - ui_ux_spec.md (query key ứng với endpoint — §3)
#   - development_guide.md (lint: npx @redocly/cli lint .spec/api_spec.yaml)
# Quy ước:
#   - Mọi response có header X-Request-Id; mọi lỗi dùng components/responses → ErrorResponse.
#   - Ràng buộc độ dài chuỗi tính theo Unicode code point (JSON Schema). Server áp thêm chuẩn hóa NFC + trim (D-17).
#   - ObjectId: chuỗi hex 24 ký tự thường. UUID: v4 chữ thường.
#   - x-requirements: ID FR/AC/EC liên quan; x-rate-limit: tên rule trong RATE_LIMITS (constants.ts).
#   - Ngoại lệ có chủ đích: POST /auth/register và GET /health không có response 401 (không yêu cầu xác thực,
#     không bao giờ trả 401); GET /health không có 400 (không nhận tham số) và response 503 dùng HealthResponse.
openapi: 3.0.3
info:
  title: HUSTALO API
  version: 1.0.0
  description: |
    REST API của HUSTALO — ứng dụng nhắn tin và gọi điện bảo mật. Realtime (chat, presence, signaling WebRTC)
    đi qua Socket.IO; hợp đồng event được mô tả trong `x-socket-events` ở gốc file này.

    Xác thực: access token JWT (HS256, 15 phút) trong header `Authorization: Bearer <token>`; refresh token
    opaque xoay vòng trong cookie `hustalo_rt` (`HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth`).
    Endpoint dùng cookie yêu cầu CSRF double-submit: header `X-CSRF-Token` bằng giá trị cookie `hustalo_csrf`.

    Định dạng lỗi: `{ "error": { "code", "message", "details"?, "requestId" } }`.
  license:
    name: Proprietary
    url: https://hustalo.local/license
  contact:
    name: HUSTALO Team
    url: https://hustalo.local
servers:
  - url: http://localhost:4000/api/v1
    description: Local (server Express trực tiếp; trình duyệt đi qua proxy HTTPS của Vite tại https://localhost:5173/api/v1)
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Đăng ký, đăng nhập, refresh token, đăng xuất, đổi mật khẩu (FR-AUTH-*).
  - name: Users
    description: Tìm kiếm, hồ sơ, chặn người dùng, quyền riêng tư (FR-USER-*).
  - name: Conversations
    description: Hội thoại DIRECT/GROUP/SECRET và thành viên (FR-CHAT-001, FR-CHAT-009, FR-GROUP-*).
  - name: Messages
    description: Lịch sử tin nhắn và read cursor (FR-CHAT-003, FR-CHAT-004). Gửi/sửa/thu hồi đi qua Socket.IO.
  - name: Calls
    description: Lịch sử cuộc gọi và ICE servers (FR-CALL-007, FR-CALL-008). Signaling đi qua Socket.IO.
  - name: E2EE
    description: Khóa công khai Signal, prekey bundle, thiết bị (FR-E2EE-*).
  - name: Health
    description: Kiểm tra trạng thái dịch vụ.

paths:
  /auth/register:
    post:
      tags: [Auth]
      operationId: registerUser
      summary: Đăng ký tài khoản và đăng nhập ngay
      description: |
        Tạo user, hash mật khẩu Argon2id, tạo session family cho `deviceId`, set cookie `hustalo_rt` và `hustalo_csrf`.
        Hai request đua nhau cùng email/username: đúng một thành công, còn lại 409.
      security: []
      x-rate-limit: register
      x-requirements: [FR-AUTH-001, AC-001, AC-002, EC-AUTH-001]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: dave@example.com
              username: dave
              password: matkhau123
              displayName: Dave Phạm
              deviceId: 6f1c2a3b-4d5e-4f60-8a7b-9c0d1e2f3a4b
      responses:
        '201':
          description: Đã tạo tài khoản
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Set-Cookie:
              $ref: '#/components/headers/SetAuthCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example.signature
                accessTokenExpiresAt: '2026-10-27T10:15:00.000Z'
                user:
                  id: 6720a1b2c3d4e5f601234567
                  email: dave@example.com
                  username: dave
                  displayName: Dave Phạm
                  avatarUrl: null
                  privacy:
                    showLastSeen: true
                  blockedUserIds: []
                  createdAt: '2026-10-27T10:00:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/login:
    post:
      tags: [Auth]
      operationId: loginUser
      summary: Đăng nhập
      description: |
        Sai email/mật khẩu hoặc tài khoản LOCKED đều trả 401 với cùng message "Email hoặc mật khẩu không đúng".
        Đăng nhập lại cùng `deviceId` thu hồi family cũ của device đó. Redis down → 503 (fail-closed, D-10).
      security: []
      x-rate-limit: login
      x-requirements: [FR-AUTH-002, AC-003, AC-004, EC-SEC-005]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: alice@hustalo.local
              password: matkhau123
              deviceId: 6f1c2a3b-4d5e-4f60-8a7b-9c0d1e2f3a4b
      responses:
        '200':
          description: Đăng nhập thành công
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Set-Cookie:
              $ref: '#/components/headers/SetAuthCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example.signature
                accessTokenExpiresAt: '2026-10-27T10:15:00.000Z'
                user:
                  id: 6720a1b2c3d4e5f601234561
                  email: alice@hustalo.local
                  username: alice
                  displayName: Alice Nguyễn
                  avatarUrl: null
                  privacy:
                    showLastSeen: true
                  blockedUserIds: []
                  createdAt: '2026-10-01T08:00:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Xoay refresh token, cấp access token mới
      description: |
        Kiến trúc §7(a) trường hợp A–D:
        - Token hiện hành → 200, cookie `hustalo_rt` mới.
        - Token vừa bị xoay trong `REFRESH_REUSE_GRACE_S` (10 s) → 409 CONFLICT, không thu hồi; client đọc lại cookie và thử lại một lần.
        - Token cũ hơn hoặc ngoài grace → thu hồi cả family (`session:revoked` REFRESH_REUSE) → 401.
        - Thiếu/sai `X-CSRF-Token` → 403.
      security:
        - refreshCookie: []
      x-rate-limit: refresh
      x-requirements: [FR-AUTH-003, AC-005, AC-006, AC-007, AC-102, EC-AUTH-003, EC-AUTH-004, EC-SEC-004]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Đã xoay token
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Set-Cookie:
              $ref: '#/components/headers/SetRefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example.signature
                accessTokenExpiresAt: '2026-10-27T10:30:00.000Z'
                user:
                  id: 6720a1b2c3d4e5f601234561
                  email: alice@hustalo.local
                  username: alice
                  displayName: Alice Nguyễn
                  avatarUrl: null
                  privacy:
                    showLastSeen: true
                  blockedUserIds: []
                  createdAt: '2026-10-01T08:00:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logoutSession
      summary: Đăng xuất phiên hiện tại
      description: |
        Thu hồi family hiện tại (reason LOGOUT), phát `session:revoked` tới các tab của session, kết thúc cuộc gọi của
        các tab đó với `endReason = LOGOUT`, xóa cookie. Gọi khi family đã bị thu hồi vẫn trả 204 (idempotent).
      security:
        - refreshCookie: []
      x-rate-limit: refresh
      x-requirements: [FR-AUTH-004, AC-008, EC-AUTH-007, EC-SEC-004]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Đã đăng xuất
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Set-Cookie:
              $ref: '#/components/headers/ClearAuthCookies'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: Thông tin người dùng hiện tại
      x-rate-limit: rest
      x-requirements: [FR-AUTH-002, FR-USER-003, AC-013, AC-108]
      responses:
        '200':
          description: Người dùng hiện tại
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMe'
              example:
                id: 6720a1b2c3d4e5f601234561
                email: alice@hustalo.local
                username: alice
                displayName: Alice Nguyễn
                avatarUrl: https://cdn.hustalo.local/avatars/alice.png
                privacy:
                  showLastSeen: true
                blockedUserIds: [6720a1b2c3d4e5f601234569]
                createdAt: '2026-10-01T08:00:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/change-password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Đổi mật khẩu và thu hồi các phiên khác
      description: |
        `currentPassword` sai → 422 `VALIDATION_ERROR` "Mật khẩu hiện tại không đúng" với
        `details: [{ field: 'currentPassword', reason: 'INVALID' }]` (không dùng 401 để client không nhầm với hết phiên;
        session hiện tại giữ nguyên). `newPassword` sai quy tắc → 400. Thành công: thu hồi mọi family khác (PASSWORD_CHANGED),
        giữ session hiện tại. Rate limit `changePassword` 5/15 phút/user; Redis down → 503 (fail-closed).
      x-rate-limit: changePassword
      x-requirements: [FR-AUTH-005, FR-SEC-005, AC-009, AC-018, EC-AUTH-006, EC-AUTH-008]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            example:
              currentPassword: matkhau123
              newPassword: matkhauMoi456
      responses:
        '204':
          description: Đã đổi mật khẩu
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Mật khẩu hiện tại không đúng (VALIDATION_ERROR, EC-AUTH-008).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Mật khẩu hiện tại không đúng
                  details:
                    - field: currentPassword
                      reason: INVALID
                  requestId: 7b1c2d3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /users/search:
    get:
      tags: [Users]
      operationId: searchUsers
      summary: Tìm kiếm người dùng
      description: |
        Khớp email chính xác (q chứa @), tiền tố username hoặc tiền tố displayName đã bỏ dấu. Loại chính mình, user LOCKED
        và user đã chặn mình. User mình đã chặn vẫn trả về với `blockedByMe: true`. Tối đa `USER_SEARCH_LIMIT` (20).
      x-rate-limit: rest
      x-requirements: [FR-USER-001, AC-012]
      parameters:
        - name: q
          in: query
          required: true
          description: Chuỗi tìm kiếm sau trim, `USER_SEARCH_MIN_QUERY`..`USER_SEARCH_MAX_QUERY` (2..100) ký tự.
          schema:
            type: string
            minLength: 2
            maxLength: 100
          example: binh
      responses:
        '200':
          description: Kết quả tìm kiếm
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSearchResponse'
              example:
                items:
                  - id: 6720a1b2c3d4e5f601234562
                    username: binh.nv
                    displayName: Nguyễn Văn Bình
                    avatarUrl: null
                    blockedByMe: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /users/me:
    patch:
      tags: [Users]
      operationId: updateMe
      summary: Cập nhật hồ sơ và quyền riêng tư
      x-rate-limit: rest
      x-requirements: [FR-USER-002, FR-USER-004, AC-013, AC-016, EC-PRES-004]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
            example:
              displayName: Alice Mới
              privacy:
                showLastSeen: false
      responses:
        '200':
          description: Đã cập nhật
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMe'
              example:
                id: 6720a1b2c3d4e5f601234561
                email: alice@hustalo.local
                username: alice
                displayName: Alice Mới
                avatarUrl: null
                privacy:
                  showLastSeen: false
                blockedUserIds: []
                createdAt: '2026-10-01T08:00:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /users/{userId}/block:
    parameters:
      - $ref: '#/components/parameters/UserIdPath'
    post:
      tags: [Users]
      operationId: blockUser
      summary: Chặn người dùng (idempotent)
      description: Chặn có hiệu lực hai chiều cho DIRECT/SECRET và cuộc gọi (D-21). Chặn chính mình → 400.
      x-rate-limit: rest
      x-requirements: [FR-USER-003, AC-014, AC-015, AC-087, EC-MSG-011, EC-CALL-SIG-013]
      responses:
        '204':
          description: Đã chặn (hoặc đã chặn từ trước)
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags: [Users]
      operationId: unblockUser
      summary: Bỏ chặn người dùng (idempotent)
      x-rate-limit: rest
      x-requirements: [FR-USER-003, AC-015]
      responses:
        '204':
          description: Đã bỏ chặn (hoặc chưa từng chặn)
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /conversations:
    get:
      tags: [Conversations]
      operationId: listConversations
      summary: Danh sách hội thoại của tôi (cursor)
      description: |
        Sắp theo `(lastMessageAt, id)` giảm dần. DIRECT chỉ hiện với người không tạo khi đã có tin đầu tiên.
        `unreadCount` đếm tối đa 100 (UI hiển thị "99+").
      x-rate-limit: rest
      x-requirements: [FR-CHAT-009, AC-039, EC-MSG-014]
      parameters:
        - $ref: '#/components/parameters/ConversationCursor'
        - $ref: '#/components/parameters/ConversationLimit'
      responses:
        '200':
          description: Một trang hội thoại
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationPage'
              example:
                items:
                  - id: 6720b1b2c3d4e5f601234501
                    type: DIRECT
                    title: null
                    avatarUrl: null
                    peer:
                      id: 6720a1b2c3d4e5f601234563
                      username: bob
                      displayName: Bob Trần
                      avatarUrl: null
                    memberCount: 2
                    lastMessage:
                      id: 6720c1b2c3d4e5f601234601
                      senderId: 6720a1b2c3d4e5f601234563
                      type: TEXT
                      preview: Mai đi cafe không?
                      createdAt: '2026-10-27T09:12:00.000Z'
                      deletedAt: null
                    lastMessageAt: '2026-10-27T09:12:00.000Z'
                    unreadCount: 3
                    myLastDeliveredMessageId: 6720c1b2c3d4e5f601234601
                    myLastReadMessageId: 6720c1b2c3d4e5f601234598
                    blockedByMe: false
                    canMessage: true
                nextCursor: WyIyMDI2LTEwLTI3VDA5OjEyOjAwLjAwMFoiLCI2NzIwYjFiMmMzZDRlNWY2MDEyMzQ1MDEiXQ
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags: [Conversations]
      operationId: createConversation
      summary: Tạo hội thoại DIRECT / SECRET / GROUP
      description: |
        - DIRECT/SECRET: idempotent theo cặp user (một hội thoại mỗi cặp cho mỗi loại, D-11). Đã có → 200; tạo mới → 201.
        - SECRET: peer không có device E2EE ACTIVE → 422 E2EE_KEYS_UNAVAILABLE.
        - GROUP: người tạo là OWNER; idempotent theo `Idempotency-Key` trong 24 h (trả 200 với nhóm đã tạo).
        - Bị chặn (DIRECT/SECRET, khi chưa có hội thoại) → 403 USER_BLOCKED.
        - GROUP vượt 100 thành viên → 422 CONVERSATION_FULL.
      x-rate-limit: rest
      x-requirements: [FR-CHAT-001, FR-GROUP-001, FR-E2EE-004, AC-017, AC-050, AC-112, EC-E2EE-001, EC-GROUP-001, EC-GROUP-002, EC-GROUP-003]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
            examples:
              direct:
                summary: Tạo DIRECT
                value:
                  type: DIRECT
                  memberIds: [6720a1b2c3d4e5f601234563]
              secret:
                summary: Tạo SECRET
                value:
                  type: SECRET
                  memberIds: [6720a1b2c3d4e5f601234563]
              group:
                summary: Tạo GROUP
                value:
                  type: GROUP
                  title: Dự án HUSTALO

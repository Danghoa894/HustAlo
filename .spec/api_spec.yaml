      tags: [Calls]
      operationId: getIceServers
      summary: Lấy ICE servers (STUN + TURN credential ngắn hạn)
      description: |
        Server gọi Xirsys (secret chỉ ở server), cache Redis `ICE_SERVERS_CACHE_TTL_S` (5 phút). Xirsys lỗi → fallback
        `STUN_URLS` + coturn (`source: FALLBACK`). `expiresAt = fetchedAt + TURN_CREDENTIAL_TTL_S`; client làm mới trước
        5 phút và trước mỗi ICE restart. `iceTransportPolicy` lấy từ `ICE_TRANSPORT_POLICY` (relay để test TURN).
        Gói miễn phí Xirsys có quota — kiểm tra lại trước production.
      x-rate-limit: rest
      x-requirements: [FR-CALL-007, AC-085, AC-090, EC-CALL-NET-003, EC-CALL-NET-004, EC-CALL-NET-005, EC-CALL-NET-006, EC-SEC-006]
      responses:
        '200':
          description: Cấu hình ICE
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              description: Luôn `no-store` (credential ngắn hạn).
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IceServersResponse'
              example:
                iceServers:
                  - urls: ['stun:stun.l.google.com:19302']
                  - urls:
                      - 'turn:tr.example.net:3478?transport=udp'
                      - 'turn:tr.example.net:3478?transport=tcp'
                      - 'turns:tr.example.net:443?transport=tcp'
                    username: ephemeral-username
                    credential: ephemeral-credential
                iceTransportPolicy: all
                expiresAt: '2026-10-27T11:00:00.000Z'
                source: XIRSYS
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /e2ee/devices:
    get:
      tags: [E2EE]
      operationId: listMyDevices
      summary: Danh sách thiết bị E2EE của tôi
      x-rate-limit: rest
      x-requirements: [FR-E2EE-001, FR-E2EE-007, AC-117]
      responses:
        '200':
          description: Danh sách thiết bị
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceList'
              example:
                items:
                  - deviceId: 6f1c2a3b-4d5e-4f60-8a7b-9c0d1e2f3a4b
                    signalDeviceId: 1
                    status: ACTIVE
                    isCurrent: true
                    userAgent: Chrome trên Windows
                    oneTimePreKeyCount: 97
                    createdAt: '2026-10-20T08:00:00.000Z'
                    revokedAt: null
                  - deviceId: 1b2c3d4e-5f60-4a7b-8c9d-0e1f2a3b4c5d
                    signalDeviceId: 2
                    status: REVOKED
                    isCurrent: false
                    userAgent: Safari trên iPhone
                    oneTimePreKeyCount: 0
                    createdAt: '2026-10-22T08:00:00.000Z'
                    revokedAt: '2026-10-25T08:00:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /e2ee/devices/{deviceId}:
    parameters:
      - $ref: '#/components/parameters/DeviceIdPath'
    delete:
      tags: [E2EE]
      operationId: revokeDevice
      summary: Thu hồi thiết bị E2EE của tôi
      description: |
        `status = REVOKED`, xóa one-time prekey của device, thu hồi session family của device (`session:revoked` DEVICE_REVOKED).
        Device không thuộc mình → 404 NOT_FOUND, body giống hệt device không tồn tại (FR-SEC-008). Đã thu hồi → 204 (idempotent).
      x-rate-limit: rest
      x-requirements: [FR-E2EE-007, FR-SEC-008, AC-117, EC-E2EE-005]
      responses:
        '204':
          description: Đã thu hồi
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /e2ee/devices/{deviceId}/keys:
    parameters:
      - $ref: '#/components/parameters/DeviceIdPath'
    put:
      tags: [E2EE]
      operationId: registerDeviceKeys
      summary: Đăng ký / cập nhật khóa công khai của device
      description: |
        `deviceId` phải bằng claim `did` của token (403). Lần đầu: bắt buộc `oneTimePreKeys` (100 khóa). Đăng ký lại cùng
        `deviceId` (IndexedDB bị xóa): ghi đè identity, xóa prekey cũ, giữ `signalDeviceId`. Xoay signed prekey: chỉ gửi
        `signedPreKey` cùng `registrationId`, `identityKey` hiện tại. Đã có 5 device ACTIVE khác → 409 CONFLICT.
        Request không bao giờ chứa khóa riêng.
      x-rate-limit: rest
      x-requirements: [FR-E2EE-001, AC-110, EC-E2EE-006]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDeviceKeysRequest'
            example:
              registrationId: 12345
              identityKey: BRERERERERERERERERERERERERERERERERERERERERER
              signedPreKey:
                keyId: 1
                publicKey: BSIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIi
                signature: c2lnbmF0dXJlX2V4YW1wbGVfNjRfYnl0ZXNfZm9yX2RvY3NfMDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYg==
              oneTimePreKeys:
                - keyId: 1
                  publicKey: BTMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMz
                - keyId: 2
                  publicKey: BURERERERERERERERERERERERERERERERERERERERERE
      responses:
        '200':
          description: Đã đăng ký
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceKeysResponse'
              example:
                deviceId: 6f1c2a3b-4d5e-4f60-8a7b-9c0d1e2f3a4b
                signalDeviceId: 1
                oneTimePreKeyCount: 100
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /e2ee/devices/{deviceId}/prekeys:
    parameters:
      - $ref: '#/components/parameters/DeviceIdPath'
    post:
      tags: [E2EE]
      operationId: uploadOneTimePreKeys
      summary: Bổ sung one-time prekey (sau e2ee:prekeys-low)
      description: '`deviceId` phải bằng `did` của token và ACTIVE (403). Trùng `keyId` đã có → 409 CONFLICT (không thêm khóa nào).'
      x-rate-limit: rest
      x-requirements: [FR-E2EE-003, AC-115, EC-E2EE-002]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadPreKeysRequest'
            example:
              oneTimePreKeys:
                - keyId: 101
                  publicKey: BVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV
                - keyId: 102
                  publicKey: BWZmZmZmZmZmZmZmZmZmZmZmZmZmZmZmZmZmZmZmZmZm
      responses:
        '200':
          description: Số prekey còn dùng được sau khi bổ sung
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreKeyCountResponse'
              example:
                oneTimePreKeyCount: 119
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /e2ee/users/{userId}/bundles:
    parameters:
      - $ref: '#/components/parameters/UserIdPath'
    get:
      tags: [E2EE]
      operationId: getPreKeyBundles
      summary: Lấy prekey bundle cho mọi device ACTIVE của user
      description: |
        Mỗi bundle tiêu thụ đúng một one-time prekey bằng `findOneAndUpdate` (consumedAt), không bao giờ cấp trùng; hết prekey →
        `oneTimePreKey: null`. Còn < 20 → phát `e2ee:prekeys-low` cho device đó (cooldown 1 h). Được gọi cho chính mình
        (trả các device khác device hiện tại). Không có chung hội thoại SECRET và không đang tạo SECRET hợp lệ → 404;
        bị chặn → 403 USER_BLOCKED; user không có device ACTIVE → 422 E2EE_KEYS_UNAVAILABLE.
      x-rate-limit: e2eeBundle
      x-requirements: [FR-E2EE-002, FR-E2EE-004, AC-111, AC-116, AC-121, EC-E2EE-001, EC-E2EE-002, EC-E2EE-008]
      responses:
        '200':
          description: Danh sách bundle
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreKeyBundlesResponse'
              example:
                userId: 6720a1b2c3d4e5f601234563
                bundles:
                  - userId: 6720a1b2c3d4e5f601234563
                    deviceId: 0a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                    signalDeviceId: 1
                    registrationId: 4321
                    identityKey: BRERERERERERERERERERERERERERERERERERERERERER
                    signedPreKey:
                      keyId: 3
                      publicKey: BSIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIi
                      signature: c2lnbmF0dXJlX2V4YW1wbGVfNjRfYnl0ZXNfZm9yX2RvY3NfMDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYg==
                    oneTimePreKey:
                      keyId: 17
                      publicKey: BTMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMz
                  - userId: 6720a1b2c3d4e5f601234563
                    deviceId: 2c3d4e5f-6a7b-4c8d-9e0f-1a2b3c4d5e6f
                    signalDeviceId: 2
                    registrationId: 8765
                    identityKey: BXd3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3
                    signedPreKey:
                      keyId: 1
                      publicKey: BYiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiI
                      signature: c2lnbmF0dXJlX2V4YW1wbGVfNjRfYnl0ZXNfZm9yX2RvY3NfZmVkY2JhOTg3NjU0MzIxMGZlZGNiYTk4NzY1NA==
                    oneTimePreKey: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Trạng thái dịch vụ
      description: 200 khi Mongo up (Redis down → `degraded`); 503 khi Mongo down hoặc server đang draining.
      security: []
      x-requirements: [AC-ARCH-009]
      responses:
        '200':
          description: Dịch vụ hoạt động
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                mongo: up
                redis: up
        '503':
          description: Dịch vụ không sẵn sàng
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: degraded
                mongo: down
                redis: up

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token JWT HS256 (TTL 15 phút). Claim `sub`, `sid`, `did`, `iss`, `aud`, `iat`, `exp`, `jti`.
    refreshCookie:
      type: apiKey
      in: cookie
      name: hustalo_rt
      description: Refresh token opaque (cookie `HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth`), kèm CSRF double-submit.

  headers:
    XRequestId:
      description: UUID v4 định danh request (nhận từ header request nếu hợp lệ, ngược lại server sinh). Trùng `error.requestId`.
      schema:
        type: string
        format: uuid
    RetryAfter:
      description: Số giây cần chờ trước khi thử lại.
      schema:
        type: integer
        minimum: 1
    SetAuthCookies:
      description: |
        `hustalo_rt=<token>; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth; Max-Age=2592000` và
        `hustalo_csrf=<random>; Secure; SameSite=Strict; Path=/; Max-Age=2592000`.
      schema:
        type: string
    SetRefreshCookie:
      description: '`hustalo_rt=<token mới>; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth; Max-Age=2592000`.'
      schema:
        type: string
    ClearAuthCookies:
      description: Xóa `hustalo_rt` và `hustalo_csrf` (Max-Age=0).
      schema:
        type: string

  parameters:
    ConversationIdPath:
      name: conversationId
      in: path
      required: true
      description: ObjectId của hội thoại.
      schema:
        $ref: '#/components/schemas/ObjectId'
    UserIdPath:
      name: userId
      in: path
      required: true
      description: ObjectId của người dùng.
      schema:
        $ref: '#/components/schemas/ObjectId'
    DeviceIdPath:
      name: deviceId
      in: path
      required: true
      description: UUID v4 của device (`hustalo.deviceId`).
      schema:
        $ref: '#/components/schemas/UuidV4'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID v4 do client sinh một lần cho mỗi ý định tạo hội thoại; giữ 24 h.
      schema:
        $ref: '#/components/schemas/UuidV4'
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      description: Bằng giá trị cookie `hustalo_csrf` (so sánh timing-safe).
      schema:
        type: string
        minLength: 43
        maxLength: 43
        pattern: '^[A-Za-z0-9_-]{43}$'
    ConversationCursor:
      name: cursor
      in: query
      required: false
      description: Cursor base64url của `(lastMessageAt, id)` từ `nextCursor` trang trước.
      schema:
        $ref: '#/components/schemas/Cursor'
    ConversationLimit:
      name: limit
      in: query
      required: false
      description: 1..CONVERSATION_PAGE_MAX (50), mặc định CONVERSATION_PAGE_DEFAULT (20).
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    BeforeCursor:
      name: before
      in: query
      required: false
      description: Lấy tin cũ hơn cursor `(createdAt, id)`. Không dùng cùng `after`.
      schema:
        $ref: '#/components/schemas/Cursor'
    AfterCursor:
      name: after
      in: query
      required: false
      description: Lấy tin mới hơn cursor `(createdAt, id)` (đồng bộ sau reconnect). Không dùng cùng `before`.
      schema:
        $ref: '#/components/schemas/Cursor'
    HistoryLimit:
      name: limit
      in: query
      required: false
      description: 1..HISTORY_PAGE_MAX (100), mặc định HISTORY_PAGE_DEFAULT (30).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
    CallCursor:
      name: cursor
      in: query
      required: false
      description: Cursor base64url của `(createdAt, id)` từ `nextCursor` trang trước.
      schema:
        $ref: '#/components/schemas/Cursor'
    CallLimit:
      name: limit
      in: query
      required: false
      description: 1..`CALL_PAGE_MAX` (50), mặc định `CALL_PAGE_DEFAULT` (20).
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20

  responses:
    BadRequest:
      description: Dữ liệu không hợp lệ (VALIDATION_ERROR).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: VALIDATION_ERROR
              message: Dữ liệu không hợp lệ
              details:
                - path: email
                  message: Email không hợp lệ
              requestId: 3b9e2f4a-1c5d-4e6f-8a7b-9c0d1e2f3a4b
    Unauthorized:
      description: Thiếu/sai token, phiên bị thu hồi, tài khoản bị khóa (UNAUTHENTICATED) hoặc access token hết hạn (TOKEN_EXPIRED).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: TOKEN_EXPIRED
              message: Phiên đăng nhập đã hết hạn
              requestId: 3b9e2f4a-1c5d-4e6f-8a7b-9c0d1e2f3a4b
    Forbidden:
      description: Không có quyền (FORBIDDEN, NOT_A_MEMBER, USER_BLOCKED).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: NOT_A_MEMBER
              message: Bạn không còn là thành viên của cuộc trò chuyện này
              requestId: 3b9e2f4a-1c5d-4e6f-8a7b-9c0d1e2f3a4b
    NotFound:
      description: Không tìm thấy (NOT_FOUND). Cũng dùng cho tài nguyên người gọi không được biết tới (chống dò ID).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: NOT_FOUND
              message: Không tìm thấy cuộc trò chuyện
              requestId: 3b9e2f4a-1c5d-4e6f-8a7b-9c0d1e2f3a4b
    Conflict:
      description: Xung đột (CONFLICT) — trùng email/username, refresh trong grace, OWNER rời nhóm, trùng keyId, quá số device.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: CONFLICT
              message: Email này đã được sử dụng
              details:
                field: email
              requestId: 3b9e2f4a-1c5d-4e6f-8a7b-9c0d1e2f3a4b
    PayloadTooLarge:
      description: Body vượt REST_BODY_LIMIT_BYTES (256 KB) — code VALIDATION_ERROR.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: VALIDATION_ERROR
              message: Dữ liệu gửi lên quá lớn
              requestId: 3b9e2f4a-1c5d-4e6f-8a7b-9c0d1e2f3a4b
    UnprocessableEntity:
      description: Hợp lệ về cú pháp nhưng không xử lý được (CONVERSATION_FULL, E2EE_KEYS_UNAVAILABLE).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: CONVERSATION_FULL
              message: Nhóm đã đạt tối đa 100 thành viên
              requestId: 3b9e2f4a-1c5d-4e6f-8a7b-9c0d1e2f3a4b
    TooManyRequests:
      description: Vượt rate limit (RATE_LIMITED).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: RATE_LIMITED
              message: Bạn thao tác quá nhanh, vui lòng thử lại sau
              requestId: 3b9e2f4a-1c5d-4e6f-8a7b-9c0d1e2f3a4b
    ServiceUnavailable:
      description: Phụ thuộc không sẵn sàng (SERVICE_UNAVAILABLE) — Mongo down, transaction hết lượt retry, Redis down với luồng auth.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: SERVICE_UNAVAILABLE
              message: Máy chủ đang bận, vui lòng thử lại
              requestId: 3b9e2f4a-1c5d-4e6f-8a7b-9c0d1e2f3a4b

  schemas:
    # ---------------------------------------------------------------- primitives
    ObjectId:
      type: string
      pattern: '^[a-f0-9]{24}$'
      example: 6720a1b2c3d4e5f601234561
    UuidV4:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      example: 6f1c2a3b-4d5e-4f60-8a7b-9c0d1e2f3a4b
    Cursor:
      type: string
      description: base64url của JSON `[createdAtISO, objectIdHex]`.
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9_-]+$'
      example: WyIyMDI2LTEwLTI3VDA5OjEyOjAwLjAwMFoiLCI2NzIwYjFiMmMzZDRlNWY2MDEyMzQ1MDEiXQ
    Base64PublicKey:
      type: string
      description: Khóa công khai Curve25519 33 byte (tiền tố kiểu 0x05) dạng base64.
      minLength: 44
      maxLength: 44
      pattern: '^[A-Za-z0-9+/]{43}[A-Za-z0-9+/=]$'
    Base64Signature:
      type: string
      description: Chữ ký 64 byte dạng base64.
      minLength: 88
      maxLength: 88
      pattern: '^[A-Za-z0-9+/]{86}==$'
    MessageText:
      type: string
      description: |
        Nội dung tin nhắn 1..MESSAGE_MAX_LENGTH (4000) code point sau chuẩn hóa NFC và trim (cả ký tự zero-width ở hai đầu).
        Chuỗi chỉ gồm khoảng trắng/zero-width bị từ chối (VALIDATION_ERROR).
      minLength: 1
      maxLength: 4000
      example: Xin chào

    # ---------------------------------------------------------------- enums
    ConversationType:
      type: string
      enum: [DIRECT, GROUP, SECRET]
    MemberRole:
      type: string
      enum: [OWNER, ADMIN, MEMBER]
    MessageType:
      type: string
      enum: [TEXT, SYSTEM]
    MessageClientStatus:
      type: string
      description: Chỉ phía client (không xuất hiện trong response REST).
      enum: [PENDING, SENT, DELIVERED, READ, FAILED]
    CallType:
      type: string
      enum: [VOICE, VIDEO]
    CallStatus:
      type: string
      enum: [INITIATED, RINGING, ACCEPTED, CONNECTING, CONNECTED, RECONNECTING, ENDED, REJECTED, CANCELLED, MISSED, BUSY, FAILED]
    CallEndReason:
      type: string
      enum: [HANGUP, REJECTED, CANCELLED, TIMEOUT, BUSY, NETWORK_FAILURE, MEDIA_FAILURE, ANSWERED_ELSEWHERE, PEER_DISCONNECTED, SERVER_RESTART, LOGOUT]
    ClientCallEndReason:
      type: string
      description: Lý do client được phép gửi trong `call:end`.
      enum: [HANGUP, NETWORK_FAILURE, MEDIA_FAILURE]
    PresenceStatus:
      type: string
      enum: [ONLINE, OFFLINE]
    DeviceStatus:
      type: string
      enum: [ACTIVE, REVOKED]
    SystemEventKind:
      type: string
      enum: [GROUP_CREATED, MEMBER_ADDED, MEMBER_REMOVED, MEMBER_LEFT, ROLE_CHANGED, OWNER_TRANSFERRED, TITLE_CHANGED, CALL_MISSED, CALL_ENDED]
    SessionRevokeReason:
      type: string
      enum: [LOGOUT, PASSWORD_CHANGED, REFRESH_REUSE, ACCOUNT_LOCKED, DEVICE_REVOKED]
    SignalMessageType:
      type: integer
      description: 1 = WHISPER, 3 = PREKEY.
      enum: [1, 3]
    ReceiptScope:
      type: string
      enum: [MESSAGE, GROUP_AGGREGATE]
    MediaConnectionReport:
      type: string
      enum: [connected, disconnected, failed]
    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - RATE_LIMITED
        - NOT_A_MEMBER
        - CONVERSATION_FULL
        - USER_BLOCKED
        - DUPLICATE_MESSAGE
        - CALL_NOT_FOUND
        - CALL_INVALID_STATE
        - CALL_BUSY
        - CALL_TIMEOUT
        - CALL_ALREADY_ANSWERED
        - E2EE_KEYS_UNAVAILABLE
        - E2EE_DECRYPT_FAILED
        - SERVICE_UNAVAILABLE
        - INTERNAL_ERROR

    # ---------------------------------------------------------------- error
    ErrorResponse:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, requestId]
          additionalProperties: false
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: Tiếng Việt; client hiển thị theo `code`, không parse `message`.
            details:
              description: 'VALIDATION_ERROR: mảng `{ path, message }` (lỗi Zod) hoặc `{ field, reason }` (422 currentPassword sai); CONFLICT: `{ field }` khi trùng email/username.'
              oneOf:
                - type: array
                  items:
                    type: object
                    required: [path, message]
                    properties:
                      path:
                        type: string
                      message:
                        type: string
                - type: array
                  items:
                    type: object
                    required: [field, reason]
                    additionalProperties: false
                    properties:
                      field:
                        type: string
                        enum: [currentPassword]
                      reason:
                        type: string
                        enum: [INVALID]
                - type: object
                  additionalProperties: true
            requestId:
              type: string
              format: uuid

    # ---------------------------------------------------------------- auth / user
    RegisterRequest:
      type: object
      required: [email, username, password, displayName, deviceId]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: '^[a-z0-9_.]{3,30}$'
        password:
          type: string
          minLength: 8
          maxLength: 128
          pattern: '^(?=.*[A-Za-z])(?=.*[0-9]).{8,128}$'
          description: Ít nhất 1 chữ cái và 1 chữ số; không trùng email hoặc username.
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        deviceId:
          $ref: '#/components/schemas/UuidV4'
    LoginRequest:
      type: object
      required: [email, password, deviceId]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
        deviceId:
          $ref: '#/components/schemas/UuidV4'
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      additionalProperties: false
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
          pattern: '^(?=.*[A-Za-z])(?=.*[0-9]).{8,128}$'
    Privacy:
      type: object
      required: [showLastSeen]
      additionalProperties: false
      properties:
        showLastSeen:
          type: boolean
          description: Tắt → mọi người nhận lastSeenAt null; có đi có lại (FR-USER-004).
    UserPublic:
      type: object
      required: [id, username, displayName, avatarUrl]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        username:
          type: string
          pattern: '^[a-z0-9_.]{3,30}$'
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        avatarUrl:
          type: string
          format: uri
          maxLength: 2048
          pattern: '^https://'
          nullable: true
        blockedByMe:
          type: boolean
          description: Chỉ có trong kết quả tìm kiếm.
    UserMe:
      type: object
      required: [id, email, username, displayName, avatarUrl, privacy, blockedUserIds, createdAt]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        email:
          type: string
          format: email
        username:
          type: string
          pattern: '^[a-z0-9_.]{3,30}$'
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        avatarUrl:
          type: string
          format: uri
          pattern: '^https://'
          nullable: true
        privacy:
          $ref: '#/components/schemas/Privacy'
        blockedUserIds:
          type: array
          maxItems: 1000
          description: Tối đa `BLOCKED_LIST_MAX` (1000).
          items:
            $ref: '#/components/schemas/ObjectId'
        createdAt:
          type: string
          format: date-time
    AuthResponse:
      type: object
      required: [accessToken, accessTokenExpiresAt, user]
      additionalProperties: false
      properties:
        accessToken:
          type: string
          description: JWT, chỉ lưu trong RAM phía client.
        accessTokenExpiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/UserMe'
    UpdateMeRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        avatarUrl:
          type: string
          format: uri
          maxLength: 2048
          pattern: '^https://'
          nullable: true
        privacy:
          $ref: '#/components/schemas/Privacy'
    UserSearchResponse:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/UserPublic'

    # ---------------------------------------------------------------- conversations
    Member:
      type: object
      required: [userId, user, role, joinedAt, lastDeliveredMessageId, lastReadMessageId]
      additionalProperties: false
      properties:
        userId:
          $ref: '#/components/schemas/ObjectId'
        user:
          $ref: '#/components/schemas/UserPublic'
        role:
          $ref: '#/components/schemas/MemberRole'
        joinedAt:
          type: string
          format: date-time
        lastDeliveredMessageId:
          type: string
          pattern: '^[a-f0-9]{24}$'
          nullable: true
        lastReadMessageId:
          type: string
          pattern: '^[a-f0-9]{24}$'
          nullable: true
    Conversation:
      type: object
      required: [id, type, title, createdBy, memberCount, members, lastMessageAt, blockedByMe, canMessage, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        type:
          $ref: '#/components/schemas/ConversationType'
        title:
          type: string
          minLength: 1
          maxLength: 100
          nullable: true
          description: GROUP có title; DIRECT/SECRET là null.
        createdBy:
          $ref: '#/components/schemas/ObjectId'
        memberCount:
          type: integer
          minimum: 1
          maximum: 100
        members:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Member'
        lastMessageAt:
          type: string
          format: date-time
        blockedByMe:
          type: boolean
          description: DIRECT/SECRET — mình đã chặn người kia. GROUP luôn false.
        canMessage:
          type: boolean
          description: false khi bị chặn bất kỳ chiều (DIRECT/SECRET).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    LastMessagePreview:
      type: object
      required: [id, senderId, type, preview, createdAt, deletedAt]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        senderId:
          $ref: '#/components/schemas/ObjectId'
        type:
          $ref: '#/components/schemas/MessageType'
        preview:
          type: string
          maxLength: 100
          nullable: true
          description: |
            TEXT: 100 code point đầu đã giải mã; SECRET: "Tin nhắn được mã hóa"; thu hồi: null (UI hiển thị
            "Tin nhắn đã bị thu hồi"); SYSTEM: null (UI dựng chuỗi từ `system` của tin, FR-CHAT-011).
        systemKind:
          $ref: '#/components/schemas/SystemEventKind'
        createdAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
    ConversationSummary:
      type: object
      required: [id, type, title, avatarUrl, memberCount, lastMessage, lastMessageAt, unreadCount, myLastDeliveredMessageId, myLastReadMessageId, blockedByMe, canMessage]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        type:
          $ref: '#/components/schemas/ConversationType'
        title:
          type: string
          maxLength: 100
          nullable: true
        avatarUrl:
          type: string
          format: uri
          nullable: true
        peer:
          $ref: '#/components/schemas/UserPublic'
        memberCount:
          type: integer
          minimum: 1
          maximum: 100
        lastMessage:
          type: object
          allOf:
            - $ref: '#/components/schemas/LastMessagePreview'
          nullable: true
        lastMessageAt:
          type: string
          format: date-time
        unreadCount:
          type: integer
          minimum: 0
          maximum: 100
          description: Đếm tối đa 100; UI hiển thị "99+" khi > 99.
        myLastDeliveredMessageId:
          type: string
          pattern: '^[a-f0-9]{24}$'
          nullable: true
        myLastReadMessageId:
          type: string
          pattern: '^[a-f0-9]{24}$'
          nullable: true
        blockedByMe:
          type: boolean
        canMessage:
          type: boolean
    ConversationPage:
      type: object
      required: [items, nextCursor]
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ConversationSummary'
        nextCursor:
          type: string
          pattern: '^[A-Za-z0-9_-]+$'
          nullable: true
    CreateDirectConversationRequest:
      type: object
      required: [type, memberIds]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [DIRECT]
        memberIds:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: '#/components/schemas/ObjectId'
    CreateSecretConversationRequest:
      type: object
      required: [type, memberIds]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [SECRET]
        memberIds:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: '#/components/schemas/ObjectId'
    CreateGroupConversationRequest:
      type: object
      required: [type, title, memberIds]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [GROUP]
        title:
          type: string
          minLength: 1
          maxLength: 100
        memberIds:
          type: array
          minItems: 1
          maxItems: 99
          uniqueItems: false
          description: Server khử trùng và bỏ chính người tạo.
          items:
            $ref: '#/components/schemas/ObjectId'
    CreateConversationRequest:
      oneOf:
        - $ref: '#/components/schemas/CreateDirectConversationRequest'
        - $ref: '#/components/schemas/CreateSecretConversationRequest'
        - $ref: '#/components/schemas/CreateGroupConversationRequest'
      discriminator:
        propertyName: type
        mapping:
          DIRECT: '#/components/schemas/CreateDirectConversationRequest'
          SECRET: '#/components/schemas/CreateSecretConversationRequest'
          GROUP: '#/components/schemas/CreateGroupConversationRequest'
    SkippedMember:
      type: object
      required: [userId, code]
      additionalProperties: false
      properties:
        userId:
          $ref: '#/components/schemas/ObjectId'
        code:
          type: string
          enum: [CONFLICT, NOT_FOUND, USER_BLOCKED]
    CreateConversationResponse:
      type: object
      required: [conversation, skipped]
      additionalProperties: false
      properties:
        conversation:
          $ref: '#/components/schemas/Conversation'
        skipped:
          type: array
          items:
            $ref: '#/components/schemas/SkippedMember'
    UpdateConversationRequest:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
    AddMembersRequest:
      type: object
      required: [userIds]
      additionalProperties: false
      properties:
        userIds:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/ObjectId'
    AddMembersResponse:
      type: object
      required: [added, skipped]
      additionalProperties: false
      properties:
        added:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        skipped:
          type: array
          items:
            $ref: '#/components/schemas/SkippedMember'
    UpdateMemberRoleRequest:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role:
          $ref: '#/components/schemas/MemberRole'

    # ---------------------------------------------------------------- messages
    E2eeRecipient:
      type: object
      required: [deviceId, type, body]
      additionalProperties: false
      properties:
        deviceId:
          $ref: '#/components/schemas/UuidV4'
        type:
          $ref: '#/components/schemas/SignalMessageType'
        body:
          type: string
          minLength: 1
          maxLength: 16384
          pattern: '^[A-Za-z0-9+/]+={0,2}$'
    E2eeEnvelope:
      type: object
      required: [v, senderDeviceId, recipients]
      additionalProperties: false
      properties:
        v:
          type: integer
          enum: [1]
        senderDeviceId:
          $ref: '#/components/schemas/UuidV4'
        recipients:
          type: array
          minItems: 1
          maxItems: 10
          description: Khi gửi (`message:send`) 1..`2 × E2EE_MAX_DEVICES_PER_USER` (10) phần tử, khớp Zod `E2eeEnvelope`.
          items:
            $ref: '#/components/schemas/E2eeRecipient'
    E2eeEnvelopeView:
      type: object
      description: Envelope trả về cho một device (REST lịch sử, `message:new`) — `recipients` chỉ còn phần tử của device đó (0 hoặc 1; 0 khi tin gửi trước khi device tham gia).
      required: [v, senderDeviceId, recipients]
      additionalProperties: false
      properties:
        v:
          type: integer
          enum: [1]
        senderDeviceId:
          $ref: '#/components/schemas/UuidV4'
        recipients:
          type: array
          minItems: 0
          maxItems: 1
          items:
            $ref: '#/components/schemas/E2eeRecipient'
    SystemPayload:
      type: object
      required: [kind, actorId, targetUserIds, title, callId, callType, durationSec]
      additionalProperties: false
      properties:
        kind:
          $ref: '#/components/schemas/SystemEventKind'
        actorId:
          $ref: '#/components/schemas/ObjectId'
        targetUserIds:
          type: array
          items:
            $ref: '#/components/schemas/ObjectId'
        title:
          type: string
          maxLength: 100
          nullable: true
          description: Tên nhóm mới (TITLE_CHANGED), 1..`GROUP_TITLE_MAX` (100) code point.
        callId:
          type: string
          pattern: '^[a-f0-9]{24}$'
          nullable: true
        callType:
          type: string
          enum: [VOICE, VIDEO, null]
          nullable: true
        durationSec:
          type: integer
          minimum: 0
          nullable: true
    MessageReceiptInfo:
      type: object
      required: [deliveredAt, readAt]
      additionalProperties: false
      description: Chỉ có cho tin của chính mình trong DIRECT/SECRET.
      properties:
        deliveredAt:
          type: string
          format: date-time
          nullable: true
        readAt:
          type: string
          format: date-time
          nullable: true
    Message:
      type: object
      required: [id, conversationId, senderId, senderDeviceId, clientMessageId, type, content, ciphertext, system, receipt, createdAt, editedAt, deletedAt]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        conversationId:
          $ref: '#/components/schemas/ObjectId'
        senderId:
          $ref: '#/components/schemas/ObjectId'
        senderDeviceId:
          type: string
          format: uuid
          nullable: true
        clientMessageId:
          type: string
          format: uuid
          nullable: true
        type:
          $ref: '#/components/schemas/MessageType'
        content:
          type: string
          maxLength: 4000
          nullable: true
          description: TEXT DIRECT/GROUP đã giải mã; null khi thu hồi, SYSTEM, SECRET, hoặc giải mã AES thất bại.
        ciphertext:
          type: object
          allOf:
            - $ref: '#/components/schemas/E2eeEnvelopeView'
          nullable: true
        system:
          type: object
          allOf:
            - $ref: '#/components/schemas/SystemPayload'
          nullable: true
        receipt:
          type: object
          allOf:
            - $ref: '#/components/schemas/MessageReceiptInfo'
          nullable: true
        createdAt:
          type: string
          format: date-time
        editedAt:
          type: string
          format: date-time
          nullable: true
        deletedAt:
          type: string
          format: date-time
          nullable: true
    MessagePage:
      type: object
      required: [items, nextBefore, nextAfter]
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Message'
        nextBefore:
          type: string
          pattern: '^[A-Za-z0-9_-]+$'
          nullable: true
        nextAfter:
          type: string
          pattern: '^[A-Za-z0-9_-]+$'
          nullable: true
    ReadRequest:
      type: object
      required: [upToMessageId]
      additionalProperties: false
      properties:
        upToMessageId:
          $ref: '#/components/schemas/ObjectId'
    ReadResponse:
      type: object
      required: [advanced, unreadCount]
      additionalProperties: false
      properties:
        advanced:
          type: boolean
        unreadCount:
          type: integer
          minimum: 0
          maximum: 100

    # ---------------------------------------------------------------- calls
    CallRecord:
      type: object
      required: [id, conversationId, callType, direction, peer, status, endReason, createdAt, connectedAt, endedAt, durationSec]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        conversationId:
          $ref: '#/components/schemas/ObjectId'
        callType:
          $ref: '#/components/schemas/CallType'
        direction:
          type: string
          enum: [OUTGOING, INCOMING]
          description: Tính theo người xem; không phải CallStatus.
        peer:
          $ref: '#/components/schemas/UserPublic'
        status:
          $ref: '#/components/schemas/CallStatus'
        endReason:
          type: string
          enum: [HANGUP, REJECTED, CANCELLED, TIMEOUT, BUSY, NETWORK_FAILURE, MEDIA_FAILURE, ANSWERED_ELSEWHERE, PEER_DISCONNECTED, SERVER_RESTART, LOGOUT, null]
          nullable: true
        createdAt:
          type: string
          format: date-time
        connectedAt:
          type: string
          format: date-time
          nullable: true
        endedAt:
          type: string
          format: date-time
          nullable: true
        durationSec:
          type: integer
          minimum: 0
          nullable: true
    CallPage:
      type: object
      required: [items, nextCursor]
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/CallRecord'
        nextCursor:
          type: string
          pattern: '^[A-Za-z0-9_-]+$'
          nullable: true
    IceServer:
      type: object
      required: [urls]
      additionalProperties: false
      properties:
        urls:
          type: array
          minItems: 1
          items:
            type: string
            pattern: '^(stun|turn|turns):'
        username:
          type: string
        credential:
          type: string
    IceServersResponse:
      type: object
      required: [iceServers, iceTransportPolicy, expiresAt, source]
      additionalProperties: false
      properties:
        iceServers:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/IceServer'
        iceTransportPolicy:
          type: string
          enum: [all, relay]
        expiresAt:
          type: string
          format: date-time
        source:
          type: string
          enum: [XIRSYS, FALLBACK]

    # ---------------------------------------------------------------- e2ee
    SignedPreKey:
      type: object
      required: [keyId, publicKey, signature]
      additionalProperties: false
      properties:
        keyId:
          type: integer
          minimum: 0
        publicKey:
          $ref: '#/components/schemas/Base64PublicKey'
        signature:
          $ref: '#/components/schemas/Base64Signature'
    OneTimePreKey:
      type: object
      required: [keyId, publicKey]
      additionalProperties: false
      properties:
        keyId:
          type: integer
          minimum: 0
          maximum: 16777215
        publicKey:
          $ref: '#/components/schemas/Base64PublicKey'
    RegisterDeviceKeysRequest:
      type: object
      required: [registrationId, identityKey, signedPreKey]
      additionalProperties: false
      properties:
        registrationId:
          type: integer
          minimum: 1
          maximum: 16380
        identityKey:
          $ref: '#/components/schemas/Base64PublicKey'
        signedPreKey:
          $ref: '#/components/schemas/SignedPreKey'
        oneTimePreKeys:
          type: array
          minItems: 1
          maxItems: 100
          description: Bắt buộc ở lần đăng ký đầu tiên (E2EE_ONE_TIME_PREKEY_BATCH = 100).
          items:
            $ref: '#/components/schemas/OneTimePreKey'
    DeviceKeysResponse:
      type: object
      required: [deviceId, signalDeviceId, oneTimePreKeyCount]
      additionalProperties: false
      properties:
        deviceId:
          $ref: '#/components/schemas/UuidV4'
        signalDeviceId:
          type: integer
          minimum: 1
        oneTimePreKeyCount:
          type: integer
          minimum: 0
    UploadPreKeysRequest:
      type: object
      required: [oneTimePreKeys]
      additionalProperties: false
      properties:
        oneTimePreKeys:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/OneTimePreKey'
    PreKeyCountResponse:
      type: object
      required: [oneTimePreKeyCount]
      additionalProperties: false
      properties:
        oneTimePreKeyCount:
          type: integer
          minimum: 0
    Device:
      type: object
      required: [deviceId, signalDeviceId, status, isCurrent, userAgent, oneTimePreKeyCount, createdAt, revokedAt]
      additionalProperties: false
      properties:
        deviceId:
          $ref: '#/components/schemas/UuidV4'
        signalDeviceId:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/DeviceStatus'
        isCurrent:
          type: boolean
        userAgent:
          type: string
          maxLength: 512
          description: Tên hiển thị dựng từ User-Agent của phiên gần nhất trên device.
        oneTimePreKeyCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          nullable: true
    DeviceList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Device'
    PreKeyBundle:
      type: object
      required: [userId, deviceId, signalDeviceId, registrationId, identityKey, signedPreKey, oneTimePreKey]
      additionalProperties: false
      properties:
        userId:
          $ref: '#/components/schemas/ObjectId'
        deviceId:
          $ref: '#/components/schemas/UuidV4'
        signalDeviceId:
          type: integer
          minimum: 1
        registrationId:
          type: integer
          minimum: 1
          maximum: 16380
        identityKey:
          $ref: '#/components/schemas/Base64PublicKey'
        signedPreKey:
          $ref: '#/components/schemas/SignedPreKey'
        oneTimePreKey:
          type: object
          allOf:
            - $ref: '#/components/schemas/OneTimePreKey'
          nullable: true
    PreKeyBundlesResponse:
      type: object
      required: [userId, bundles]
      additionalProperties: false
      properties:
        userId:
          $ref: '#/components/schemas/ObjectId'
        bundles:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: '#/components/schemas/PreKeyBundle'

    # ---------------------------------------------------------------- health
    HealthResponse:
      type: object
      required: [status, mongo, redis]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok, degraded, draining]
        mongo:
          type: string
          enum: [up, down]
        redis:
          type: string
          enum: [up, down]

    # ================================================================ socket (dùng bởi x-socket-events)
    ClientEnvelope:
      type: object
      description: Mọi event client→server có dạng `{ requestId, payload }` kèm callback ACK. `payload` theo từng event.
      required: [requestId, payload]
      additionalProperties: false
      properties:
        requestId:
          type: string
          format: uuid
        payload:
          type: object
    AckError:
      type: object
      required: [ok, requestId, error]
      additionalProperties: false
      properties:
        ok:
          type: boolean
          enum: [false]
        requestId:
          type: string
          format: uuid
          description: requestId của envelope; envelope không đọc được → 00000000-0000-0000-0000-000000000000.
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
    AckOkBase:
      type: object
      description: 'ACK thành công `{ ok: true, requestId, data }`; `data` theo từng event (schema `*AckData`).'
      required: [ok, requestId, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        requestId:
          type: string
          format: uuid
        data:
          type: object
    ServerEventMeta:
      type: object
      description: Trường có trong mọi event server→client.
      required: [eventId, occurredAt]
      properties:
        eventId:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
    EmptyAckData:
      type: object
      additionalProperties: false
      properties: {}

    # ---- session
    SessionExpiredEvent:
      allOf:
        - $ref: '#/components/schemas/ServerEventMeta'
        - type: object
          required: [reason, expiredAt]
          properties:
            reason:
              type: string
              enum: [TOKEN_EXPIRED]
            expiredAt:
              type: string
              format: date-time
    SessionRevokedEvent:
      allOf:
        - $ref: '#/components/schemas/ServerEventMeta'
        - type: object
          required: [reason]
          properties:
            reason:
              $ref: '#/components/schemas/SessionRevokeReason'

    # ---- conversation
    ConversationIdPayload:
      type: object
      required: [conversationId]
      additionalProperties: false
      properties:
        conversationId:
          $ref: '#/components/schemas/ObjectId'
    ConversationJoinAckData:
      type: object
      required: [conversation, unreadCount, typingUserIds]
      additionalProperties: false
      properties:
        conversation:
          $ref: '#/components/schemas/Conversation'
        unreadCount:
          type: integer
          minimum: 0
          maximum: 100
        typingUserIds:
          type: array
          items:
            $ref: '#/components/schemas/ObjectId'
    ConversationUpdatedEvent:
      allOf:
        - $ref: '#/components/schemas/ServerEventMeta'
        - type: object
          required: [conversation, change]
          properties:
            conversation:
              $ref: '#/components/schemas/Conversation'
            change:
              type: string
              enum: [CREATED, TITLE, MEMBERS, ROLE, OWNER]
    ConversationMemberRemovedEvent:
      allOf:
        - $ref: '#/components/schemas/ServerEventMeta'
        - type: object
          required: [conversationId, userId, removedBy, reason]
          properties:
            conversationId:
              $ref: '#/components/schemas/ObjectId'
            userId:
              $ref: '#/components/schemas/ObjectId'
            removedBy:
              $ref: '#/components/schemas/ObjectId'
            reason:
              type: string
              enum: [REMOVED, LEFT]

    # ---- message
    MessageSendPlaintextPayload:
      type: object
      required: [kind, conversationId, clientMessageId, content]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [PLAINTEXT]
        conversationId:
          $ref: '#/components/schemas/ObjectId'
        clientMessageId:
          $ref: '#/components/schemas/UuidV4'
        content:
          $ref: '#/components/schemas/MessageText'
    MessageSendE2eePayload:
      type: object
      required: [kind, conversationId, clientMessageId, ciphertext]
      additionalProperties: false
      description: Có trường `content` → VALIDATION_ERROR (additionalProperties false).
      properties:
        kind:
          type: string
          enum: [E2EE]
        conversationId:
          $ref: '#/components/schemas/ObjectId'
        clientMessageId:
          $ref: '#/components/schemas/UuidV4'
        ciphertext:
          $ref: '#/components/schemas/E2eeEnvelope'
    MessageSendPayload:
      oneOf:
        - $ref: '#/components/schemas/MessageSendPlaintextPayload'
        - $ref: '#/components/schemas/MessageSendE2eePayload'
      discriminator:
        propertyName: kind
        mapping:
          PLAINTEXT: '#/components/schemas/MessageSendPlaintextPayload'
          E2EE: '#/components/schemas/MessageSendE2eePayload'
    MessageSendAckData:
      type: object
      required: [message, duplicate]
      additionalProperties: false
      properties:
        message:
          $ref: '#/components/schemas/Message'
        duplicate:
          type: boolean
          description: true ⇔ DUPLICATE_MESSAGE (không phải lỗi) — trả bản đã lưu, không fan-out lại.
    MessageNewEvent:
      allOf:
        - $ref: '#/components/schemas/ServerEventMeta'
        - type: object
          required: [message]
          properties:
            message:
              $ref: '#/components/schemas/Message'
    ReceiptCursorPayload:
      type: object
      required: [conversationId, upToMessageId]
      additionalProperties: false
      properties:
        conversationId:
          $ref: '#/components/schemas/ObjectId'
        upToMessageId:
          $ref: '#/components/schemas/ObjectId'
    MessageDeliveredAckData:
      type: object
      required: [advanced]
      additionalProperties: false
      properties:
        advanced:
          type: boolean
    MessageReadAckData:
      $ref: '#/components/schemas/ReadResponse'
    MessageStatusEvent:
      allOf:
        - $ref: '#/components/schemas/ServerEventMeta'
        - oneOf:
            - type: object
              required: [conversationId, scope, messageIds, status, byUserId, at]
              properties:
                conversationId:
                  $ref: '#/components/schemas/ObjectId'
                scope:
                  type: string
                  enum: [MESSAGE]
                messageIds:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/ObjectId'
                status:
                  type: string
                  enum: [DELIVERED, READ]
                byUserId:
                  $ref: '#/components/schemas/ObjectId'
                at:
                  type: string
                  format: date-time
            - type: object
              required: [conversationId, scope, userId, lastDeliveredMessageId, lastReadMessageId]
              properties:
                conversationId:
                  $ref: '#/components/schemas/ObjectId'
                scope:
                  type: string
                  enum: [GROUP_AGGREGATE]
                userId:
                  $ref: '#/components/schemas/ObjectId'
                lastDeliveredMessageId:
                  type: string
                  pattern: '^[a-f0-9]{24}$'
                  nullable: true
                lastReadMessageId:
                  type: string
                  pattern: '^[a-f0-9]{24}$'
                  nullable: true
    MessageEditPayload:
      type: object
      required: [messageId, content]
      additionalProperties: false
      properties:
        messageId:
          $ref: '#/components/schemas/ObjectId'
        content:
          $ref: '#/components/schemas/MessageText'
    MessageDeletePayload:
      type: object
      required: [messageId]
      additionalProperties: false
      properties:
        messageId:
          $ref: '#/components/schemas/ObjectId'
    MessageAckData:
      type: object
      required: [message]
      additionalProperties: false
      properties:
        message:
          $ref: '#/components/schemas/Message'
    MessageChangedEvent:
      description: Dùng cho S→C `message:edit` và `message:delete`.
      allOf:
        - $ref: '#/components/schemas/ServerEventMeta'
        - type: object
          required: [message]
          properties:
            message:
              $ref: '#/components/schemas/Message'

    # ---- typing / presence
    TypingUpdateEvent:
      allOf:
        - $ref: '#/components/schemas/ServerEventMeta'
        - type: object
          required: [conversationId, userId, isTyping]
          properties:
            conversationId:
              $ref: '#/components/schemas/ObjectId'
            userId:
              $ref: '#/components/schemas/ObjectId'
            isTyping:
              type: boolean
    PresenceSubscribePayload:
      type: object
      required: [userIds]
      additionalProperties: false
      properties:
        userIds:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: '#/components/schemas/ObjectId'
    PresenceSubscribeAckData:
      type: object
      required: [accepted]
      additionalProperties: false
      properties:
        accepted:
          type: array
          items:
            $ref: '#/components/schemas/ObjectId'
    PresenceEntry:
      type: object
      required: [userId, status, lastSeenAt]
      additionalProperties: false
      properties:
        userId:
          $ref: '#/components/schemas/ObjectId'
        status:
          $ref: '#/components/schemas/PresenceStatus'
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
    PresenceSnapshotEvent:
      allOf:
        - $ref: '#/components/schemas/ServerEventMeta'
        - type: object
          required: [users, degraded]
          properties:
            users:
              type: array
              items:
                $ref: '#/components/schemas/PresenceEntry'
            degraded:
              type: boolean
    PresenceUpdateEvent:
      allOf:
        - $ref: '#/components/schemas/ServerEventMeta'
        - $ref: '#/components/schemas/PresenceEntry'

    # ---- call
    CallInvitePayload:
      type: object
      required: [conversationId, callType]
      additionalProperties: false
      properties:
        conversationId:
          $ref: '#/components/schemas/ObjectId'
        callType:
          $ref: '#/components/schemas/CallType'
    CallInviteAckData:
      type: object
      required: [callId, status, merged, callType]
      additionalProperties: false
      properties:
        callId:
          $ref: '#/components/schemas/ObjectId'
        status:
          $ref: '#/components/schemas/CallStatus'
        merged:
          type: boolean
          description: true khi glare — lời mời được gộp vào cuộc gọi ngược chiều đang đổ chuông (D-03).
        callType:
          $ref: '#/components/schemas/CallType'
    CallIdPayload:
      type: object
      required: [callId]
      additionalProperties: false
      properties:
        callId:
          $ref: '#/components/schemas/ObjectId'
    CallStatusAckData:
      type: object
      required: [callId, status]
      additionalProperties: false
      properties:
        callId:
          $ref: '#/components/schemas/ObjectId'
        status:
          $ref: '#/components/schemas/CallStatus'
    CallEndAckData:
      type: object
      required: [callId, status, endReason]
      additionalProperties: false
      properties:
        callId:
          $ref: '#/components/schemas/ObjectId'
        status:
          $ref: '#/components/schemas/CallStatus'
        endReason:
          $ref: '#/components/schemas/CallEndReason'
    CallIncomingEvent:
      allOf:
        - $ref: '#/components/schemas/ServerEventMeta'
        - type: object
          required: [callId, conversationId, callType, caller, ringExpiresAt]
          properties:
            callId:
              $ref: '#/components/schemas/ObjectId'
            conversationId:
              $ref: '#/components/schemas/ObjectId'
            callType:
              $ref: '#/components/schemas/CallType'
            caller:
              $ref: '#/components/schemas/UserPublic'
            ringExpiresAt:
              type: string
              format: date-time
              description: Thời điểm hết đổ chuông theo deadline RING của server; client đếm ngược theo trường này, không đọc CALL_RING_TIMEOUT_MS.
    CallIncomingClientAck:
      type: object
      description: Client trả qua callback của `call:incoming` (server emit có timeout CALL_INCOMING_ACK_TIMEOUT_MS = 5 s).
      required: [ok]
      additionalProperties: false
      properties:
        ok:
          type: boolean
          enum: [true]
    CallRingingEvent:
      description: Dùng cho `call:ringing`.
      allOf:
        - $ref: '#/components/schemas/ServerEventMeta'
        - type: object
          required: [callId, ringExpiresAt]
          properties:
            callId:
              $ref: '#/components/schemas/ObjectId'
            ringExpiresAt:
              type: string
              format: date-time
              description: Như `call:incoming.ringExpiresAt`; caller đếm ngược theo trường này.
    CallAcceptedEvent:
      allOf:
        - $ref: '#/components/schemas/ServerEventMeta'
        - type: object
          required: [callId, acceptedDeviceId, acceptedTabId]
          properties:
            callId:
              $ref: '#/components/schemas/ObjectId'
            acceptedDeviceId:
              $ref: '#/components/schemas/UuidV4'
            acceptedTabId:
              $ref: '#/components/schemas/UuidV4'
    CallAnsweredElsewhereEvent:
      allOf:
        - $ref: '#/components/schemas/ServerEventMeta'
        - type: object
          required: [callId, reason]
          properties:
            callId:
              $ref: '#/components/schemas/ObjectId'
            reason:
              type: string
              enum: [ANSWERED_ELSEWHERE]
    CallBusyEvent:
      allOf:
        - $ref: '#/components/schemas/ServerEventMeta'
        - type: object
          required: [callId, caller, callType]
          properties:
            callId:
              $ref: '#/components/schemas/ObjectId'
            caller:
              $ref: '#/components/schemas/UserPublic'
            callType:
              $ref: '#/components/schemas/CallType'
    CallSdpPayload:
      type: object
      required: [callId, revision, sdp]
      additionalProperties: false
      description: Dùng cho `call:offer` và `call:answer` (C→S và relay S→C kèm ServerEventMeta). Không bao giờ log `sdp`.
      properties:
        callId:
          $ref: '#/components/schemas/ObjectId'
        revision:
          type: integer
          minimum: 1
        sdp:
          type: string
          minLength: 1
          maxLength: 20000
    CallSdpEvent:
      allOf:
        - $ref: '#/components/schemas/ServerEventMeta'
        - $ref: '#/components/schemas/CallSdpPayload'
    CallRevisionAckData:
      type: object
      required: [revision]
      additionalProperties: false
      properties:
        revision:
          type: integer
          minimum: 1
    IceCandidate:
      type: object
      required: [candidate, sdpMid, sdpMLineIndex, usernameFragment]
      additionalProperties: false
      properties:
        candidate:
          type: string
          maxLength: 1024
          description: Chuỗi rỗng = end-of-candidates. Không bao giờ log.
        sdpMid:
          type: string
          maxLength: 64
          nullable: true
        sdpMLineIndex:
          type: integer
          minimum: 0
          maximum: 16
          nullable: true
        usernameFragment:
          type: string
          maxLength: 256
          nullable: true
    CallIcePayload:
      type: object
      required: [callId, revision, candidate]
      additionalProperties: false
      properties:
        callId:
          $ref: '#/components/schemas/ObjectId'
        revision:
          type: integer
          minimum: 1
        candidate:
          $ref: '#/components/schemas/IceCandidate'
    CallIceEvent:
      allOf:
        - $ref: '#/components/schemas/ServerEventMeta'
        - $ref: '#/components/schemas/CallIcePayload'
    CallIceRestartPayload:
      type: object
      required: [callId, attempt]
      additionalProperties: false
      properties:
        callId:
          $ref: '#/components/schemas/ObjectId'
        attempt:
          type: integer
          minimum: 1
          description: Không giới hạn trên ở schema; vượt CALL_MAX_ICE_RESTARTS (2) → CALL_INVALID_STATE từ state machine (T30).
    CallIceRestartEvent:
      allOf:
        - $ref: '#/components/schemas/ServerEventMeta'
        - $ref: '#/components/schemas/CallIceRestartPayload'
    CallIceRestartAckData:
      type: object
      required: [attempt]
      additionalProperties: false
      properties:
        attempt:
          type: integer
          minimum: 1
          maximum: 2
    CallEndPayload:
      type: object
      required: [callId, reason]
      additionalProperties: false
      properties:
        callId:
          $ref: '#/components/schemas/ObjectId'
        reason:
          $ref: '#/components/schemas/ClientCallEndReason'
    CallStateReportPayload:
      type: object
      required: [callId, connectionState]
      additionalProperties: false
      properties:
        callId:
          $ref: '#/components/schemas/ObjectId'
        connectionState:
          $ref: '#/components/schemas/MediaConnectionReport'
    CallStateAckData:
      type: object
      required: [status, version]
      additionalProperties: false
      properties:
        status:
          $ref: '#/components/schemas/CallStatus'
        version:
          type: integer
          minimum: 1
    CallStateEvent:
      allOf:
        - $ref: '#/components/schemas/ServerEventMeta'
        - type: object
          required: [callId, conversationId, status, endReason, callType, callerId, calleeId, acceptedDeviceId, acceptedTabId, connectedAt, endedAt, version]
          properties:
            callId:
              $ref: '#/components/schemas/ObjectId'
            conversationId:
              $ref: '#/components/schemas/ObjectId'
            status:
              $ref: '#/components/schemas/CallStatus'
            endReason:
              type: string
              enum: [HANGUP, REJECTED, CANCELLED, TIMEOUT, BUSY, NETWORK_FAILURE, MEDIA_FAILURE, ANSWERED_ELSEWHERE, PEER_DISCONNECTED, SERVER_RESTART, LOGOUT, null]
              nullable: true
            callType:
              $ref: '#/components/schemas/CallType'
            callerId:
              $ref: '#/components/schemas/ObjectId'
            calleeId:
              $ref: '#/components/schemas/ObjectId'
            acceptedDeviceId:
              type: string
              format: uuid
              nullable: true
            acceptedTabId:
              type: string
              format: uuid
              nullable: true
            connectedAt:
              type: string
              format: date-time
              nullable: true
            endedAt:
              type: string
              format: date-time
              nullable: true
            version:
              type: integer
              minimum: 1

    # ---- e2ee
    E2eePrekeysLowEvent:
      allOf:
        - $ref: '#/components/schemas/ServerEventMeta'
        - type: object
          required: [deviceId, remaining]
          properties:
            deviceId:
              $ref: '#/components/schemas/UuidV4'
            remaining:
              type: integer
              minimum: 0
              maximum: 19

# ==================================================================== Socket.IO
# Hợp đồng event (system_architecture.md §4.5). Agent sinh `ClientToServerEvents` / `ServerToClientEvents`
# (packages/shared/src/events/socket-types.ts) từ khối này. Socket path `/socket.io`, namespace `/`.
# Handshake `auth: { token, deviceId, tabId }`. C→S luôn là ClientEnvelope với `payload` theo bảng; ACK là
# AckOkBase (data = `ack`) hoặc AckError. `rateLimit` là tên rule trong RATE_LIMITS.
x-socket-events:
  handshake:
    auth:
      token: Access token JWT (bắt buộc)
      deviceId: UUID v4, phải bằng claim did
      tabId: UUID v4 trong sessionStorage (định tuyến signaling cuộc gọi)
    connectErrors: [UNAUTHENTICATED, TOKEN_EXPIRED]
    rooms: ['user:{userId}', 'device:{deviceId}', 'tab:{tabId}', 'session:{sid}']
  envelope:
    $ref: '#/components/schemas/ClientEnvelope'
  ackOk:
    $ref: '#/components/schemas/AckOkBase'
  ackError:
    $ref: '#/components/schemas/AckError'
  serverEventMeta:
    $ref: '#/components/schemas/ServerEventMeta'
  events:
    session:expired:
      direction: server-to-client
      target: 'session:{sid}'
      payload:
        $ref: '#/components/schemas/SessionExpiredEvent'
      requirements: [FR-AUTH-007, AC-011, EC-AUTH-002]
    session:revoked:
      direction: server-to-client
      target: 'session:{sid}'
      payload:
        $ref: '#/components/schemas/SessionRevokedEvent'
      requirements: [FR-AUTH-003, FR-AUTH-005, FR-AUTH-006, FR-E2EE-007, AC-006, AC-009, AC-010, AC-117, EC-AUTH-004, EC-AUTH-005, EC-AUTH-006]
    conversation:join:
      direction: client-to-server
      payload:
        $ref: '#/components/schemas/ConversationIdPayload'
      ack:
        $ref: '#/components/schemas/ConversationJoinAckData'
      authorization: Là thành viên hiện tại (AUTHZ-2)
      rateLimit: socketGeneric

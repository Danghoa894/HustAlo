# ==================================================================== Consistency Check
# - [x] Enum, event, mã lỗi, hằng số khớp mục 2 và 3:
#       components/schemas định nghĩa đủ ConversationType, MemberRole, MessageType, MessageClientStatus, CallType,
#       CallStatus (12), CallEndReason (11), PresenceStatus, ErrorCode (20) và enum [NEW] của kiến trúc §4.4.2
#       (DeviceStatus, SystemEventKind, SessionRevokeReason, SignalMessageType, ReceiptScope, MediaConnectionReport,
#       ClientCallEndReason). x-socket-events có đúng 35 event của §4.5, không có message:ack / call:initiate.
#       Ràng buộc số: MessageText 4000, title 100, displayName 80, username ^[a-z0-9_.]{3,30}$, password 8..128,
#       history limit 1..100 (mặc định 30), conversation limit 1..50 (mặc định 20), GROUP memberIds ≤ 99, add ≤ 50,
#       memberCount ≤ 100, unreadCount ≤ 100, presence subscribe ≤ 200, sdp ≤ 20000, candidate ≤ 1024,
#       ice-restart attempt ≥ 1 (giới hạn 2 kiểm ở state machine), recipients 1..10 khi gửi / 0..1 khi trả về, prekeys ≤ 100, prekeys-low remaining ≤ 19, bundles ≤ 5 device.
# - [x] FR/AC tham chiếu bằng ID: mọi operation và event có x-requirements / requirements.
# - [x] Edge case có ID: EC liên quan REST/socket gắn ở x-requirements (AUTH, NET, MSG, GROUP, PRES, CALL-SIG,
#       CALL-MEDIA, CALL-NET, INFRA, SEC, E2EE).
# - [x] Không có secret thật: token/credential/khóa trong example là chuỗi minh họa không hợp lệ; domain tr.example.net.
# - [x] Không mâu thuẫn với file trước — điểm đã đối chiếu:
#       * Kiến trúc §4.6: đủ 27 endpoint gồm 4 endpoint [NEW] (/auth/change-password, PATCH members/{userId},
#         GET /e2ee/devices, DELETE /e2ee/devices/{deviceId}); cookie/CSRF theo §6.3; ICE servers theo §9.5.
#       * PRD: blockedUserIds trong UserMe, blockedByMe/canMessage/myLast*MessageId trong ConversationSummary,
#         direction trong CallRecord, skipped với CONFLICT/NOT_FOUND/USER_BLOCKED, OWNER rời nhóm → 409,
#         GROUP call → VALIDATION_ERROR, SECRET chỉ ciphertext.
#       * DB: Message DTO phản ánh contentEnc (giải mã thành content), ciphertext, system (senderId = actor), editedAt,
#         deletedAt; cursor base64url [createdAtISO, id] theo database_schema.md §4; consumedAt cho one-time prekey.
#       * UI: query key ui_ux_spec.md §3 ánh xạ theo method + path của endpoint (không dùng operationId).
#       * Ngoại lệ có chủ đích (ghi ở đầu file): /auth/register và /health không có 401; /health không có 400 và
#         response 503 dùng HealthResponse thay vì ErrorResponse (để probe đọc trạng thái từng phụ thuộc).

# client/nginx.conf — nginx trong image client (nginxinc/nginx-unprivileged, cổng 8080, non-root) phục vụ client/dist.
# development_guide.md §9.3: SPA fallback (/chats/:id, /call/:callId… → index.html); /assets/* băm tên → cache lâu;
# index.html → no-cache. TLS và header bảo mật ở nginx biên (infra/nginx/nginx.conf).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # NFR-05: JS khởi tạo ~170 KB sau gzip (không nén ~520 KB) — bắt buộc nén.
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
